; Config di cava per lo spettro nella pill (services/Spectrum.qml).
; Uscita raw ASCII su stdout: una riga per frame, valori 0-100 separati da ';'.
; `bars` DEVE coincidere con Config.spectrumBars (larghezza riservata nella pill).

[general]
framerate = 60
bars = 6
autosens = 1

[input]
; Monitor del sink di default: cattura tutto cio' che suona, non il solo
; stream di Spotify (cava non sa agganciarsi a un singolo stream di playback).
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
