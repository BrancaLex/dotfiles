font_size 14.0

allow_remote_control yes
listen_on unix:/tmp/kitty-${USER}

# vim:ft=kitty

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono NFM"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

background_opacity 0.45

# Include pywal colors (must be at the end to override other themes)
include ~/.cache/wal/colors-kitty.conf
