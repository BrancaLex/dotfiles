[ids]
*

[main]
# capslock: tap = Esc, hold = Ctrl (mod-tap)
capslock = overload(control, esc)
# shift: modificatore puro, NESSUN mod-tap.
# Il precedente `overload(shift, backspace)` rendeva ogni pressione di shift
# ambigua: keyd non puo' emettere nulla finche' non sa se sara' tap o hold, quindi
# deve attendere l'evento successivo (altro tasto -> hold, rilascio -> tap). Su
# shift e' il caso peggiore, essendo il modificatore piu' battuto durante la
# digitazione veloce. Rimosso per latenza e per evitare misfire.
# capslock resta overload: e' un tasto altrimenti inutilizzato, e il costo
# dell'ambiguita' li' e' accettabile.
