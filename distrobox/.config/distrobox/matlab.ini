# Manifesto distrobox-assemble per il container MATLAB R2026b.
# Riproduce il container con accesso completo alla GPU NVIDIA (CUDA + OpenGL PRIME offload).
# MATLAB stesso risiede in ~/MATLAB/R2026b (home bind-montata) — non è nell'immagine.
#
# Ricostruzione:  distrobox assemble create --file ~/.config/distrobox/matlab.ini
# Installazione MATLAB (dentro il container, nessun login richiesto; la licenza si attiva
# al primo avvio con l'account MathWorks):
#   wget https://www.mathworks.com/mpm/glnxa64/mpm && chmod +x mpm
#   ./mpm install --release=R2026b --destination=$HOME/MATLAB/R2026b --products MATLAB \
#     Simulink Control_System_Toolbox Simulink_Control_Design Aerospace_Toolbox \
#     Aerospace_Blockset Parallel_Computing_Toolbox
#
# additional_packages: dipendenze runtime ufficiali MathWorks (container-images/matlab-deps,
# ubuntu24.04 — lista r2026a, quella r2026b non era ancora pubblicata) + mesa-utils.

[matlab-r2026b]
image=docker.io/library/ubuntu:24.04
nvidia=true
additional_packages=mesa-utils ca-certificates debianutils ibverbs-providers libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatomic1 libatspi2.0-0t64 libboost-atomic1.74.0 libboost-chrono1.74.0t64 libboost-date-time1.74.0 libboost-filesystem1.74.0 libboost-log1.74.0 libboost-program-options1.74.0 libboost-regex1.74.0 libboost-system1.74.0 libboost-thread1.74.0 libc6 libcairo-gobject2 libcairo2 libcap2 libcrypt1 libcups2t64 libfontconfig1 libfribidi0 libgbm1 libgdk-pixbuf-2.0-0 libgl1 libglib2.0-0t64 libglx0 libgstreamer-plugins-base1.0-0 libgstreamer1.0-0 libgtk-3-0t64 libhidapi-libusb0 libibverbs1 libice6 libmosquitto1 libmosquittopp1 libnspr4 libnss3 libnuma1 libopengl0 libpam0g libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libpixman-1-0 libpsm2-2 librdmacm1t64 libsndfile1 libtirpc3t64 libucx0 libudev1 libuhd4.6.0-dpdk libuuid1 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 libxfont2 libxft2 libxinerama1 libxrandr2 libxt6t64 libxtst6 libxxf86vm1 locales locales-all make net-tools procps sudo unzip x11-xkb-utils zlib1g wget
