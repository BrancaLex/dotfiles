general {
  # Comando di lock (ciò che loginctl lock-session fa scattare).
  lock_cmd = pidof hyprlock || hyprlock
  # Blocca PRIMA di ogni sospensione (timer di idle O chiusura coperchio via
  # logind) → al risveglio si trova hyprlock, mai il desktop sbloccato.
  before_sleep_cmd = loginctl lock-session
  # Riaccende lo schermo al risveglio.
  after_sleep_cmd = hyprctl dispatch dpms on
}

# 120s: abbassa la luminosità (ripristinata al movimento).
listener {
  timeout = 120
  on-timeout = brightnessctl -s set 10
  on-resume = brightnessctl -r
}

# 140s: blocca la sessione PRIMA di spegnere lo schermo.
listener {
  timeout = 140
  on-timeout = loginctl lock-session
}

# 150s: spegne lo schermo (dpms).
listener {
  timeout = 150
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

# 300s: sospende il sistema (il before_sleep_cmd ha già bloccato).
listener {
  timeout = 300
  on-timeout = systemctl suspend
}
