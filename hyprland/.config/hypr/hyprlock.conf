# hyprlock — layout minimale: sfondo blur + orologio + data + input.
# Colori da pywal (~/.cache/wal/colors-hyprland.conf): $foreground, $color0, $color4.
source = ~/.cache/wal/colors-hyprland.conf

general {
    no_fade_in = true
    grace = 1
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

# SFONDO — screenshot sfocato.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

# OROLOGIO — HH:MM, unico elemento di richiamo.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $foreground
    shadow_pass = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 130
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, 60
    halign = center
    valign = center
}

# DATA — sotto l'orologio.
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = $foreground
    font_size = 18
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, -70
    halign = center
    valign = center
}

# INPUT — campo password.
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    outer_color = $color4
    inner_color = $color0
    font_color = $foreground
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    font_family = JetBrains Mono Nerd Font Mono
    placeholder_text = <i>$USER</i>
    hide_input = false
    position = 0, -160
    halign = center
    valign = center
}
